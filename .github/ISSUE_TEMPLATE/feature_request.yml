name: Feature request
description: A new check, sync client, repair or option.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What damage or situation is not handled today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should gitbrella do? Mind the rules in docs/design.md.
